<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HONOURABLE ISMAIL SABON GARU</title>
</head>

<body style="margin:0;font-family:Arial,sans-serif;background:#f5f5f5;">

  <div style="background:#006400;color:white;text-align:center;padding:20px;">
    <h2>WELCOME</h2>
    <img src="logo.png" alt="Logo" width="120">

    <h1>HONOURABLE ISMAIL SABON GARU</h1>
    <p>Official Registration Portal</p>
  </div>

  <div style="max-width:500px;margin:30px auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.2);">

    <h2 style="text-align:center;">Dashboard</h2>

    <form>

      <label>Passport Photo (PNG/JPG, White Background, Max 2MB)</label><br>
      <input type="file" accept=".png,.jpg,.jpeg"><br><br>

      <label>First Name</label><br>
      <input type="text" style="width:100%;padding:10px;"><br><br>

      <label>Middle Name</label><br>
      <input type="text" style="width:100%;padding:10px;"><br><br>

      <label>Last Name</label><br>
      <input type="text" style="width:100%;padding:10px;"><br><br>

      <label>Address</label><br>
      <input type="text" style="width:100%;padding:10px;"><br><br>

      <label>Phone Number</label><br>
      <input type="tel" style="width:100%;padding:10px;"><br><br>

      <label>State</label><br>
      <select style="width:100%;padding:10px;">
        <option>Jigawa</option>
      </select><br><br>

      <label>LGA</label><br>
      <select style="width:100%;padding:10px;">
        <option>Hadejia</option>
      </select><br><br>

      <label>Ward</label><br>
      <select style="width:100%;padding:10px;">
        <option>Sabon Garu</option>
      </select><br><br>

      <button style="width:100%;padding:15px;background:green;color:white;border:none;border-radius:5px;">
        Submit Application
      </button>

    </form>

  </div>

</body>
  </html>
