<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HONOURABLE ISMAIL SABON GARU | Membership Registration</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<div class="print-id-btn" onclick="openIdSearch()">
🪪 Print Your ID Card
</div>
<header class="header">

<img src="20260802_132740.png" alt="TTT Logo" class="logo">

<h2>WELCOME TO</h2>

<h1>HONOURABLE ISMAIL SABON GARU</h1>

<p class="subtitle">MEMBERSHIP REGISTRATION FORM</p>

</header>

<main class="container">

<form id="registrationForm">

<div class="form-group">
<label for="passport">Passport Photo *</label>
<input type="file"
id="passport"
accept=".jpg,.jpeg,.png"
required>
</div>

<div class="form-group">
<label for="firstName">First Name *</label>
<input type="text"
id="firstName"
placeholder="Enter First Name"
required>
</div>

<div class="form-group">
<label for="middleName">Middle Name*</label>
<input type="text"
id="middleName"
placeholder="Enter Middle Name">
</div>

<div class="form-group">
<label for="lastName">Last Name *</label>
<input type="text"
id="lastName"
placeholder="Enter Last Name"
required>
</div>

<div class="form-group">
<label for="address">Address *</label>
<input type="text"
id="address"
placeholder="Enter Your Address"
required>
</div>

<div class="form-group">
<label for="phoneNumber">Phone Number *</label>
<input type="tel"
id="phoneNumber"
placeholder="08012345678"
maxlength="11"
required>
</div>

<div class="form-group">
<label for="gender">Gender *</label>

<select id="gender" required>

<option value="">Select Gender</option>

<option value="Male">Male</option>

<option value="Female">Female</option>

</select>

</div>

<div class="form-group">

<label for="state">State *</label>

<select id="state" required>

<option value="" selected disabled>-- Select State --</option>

<option value="Jigawa">Jigawa</option>

</select>

</div>

<div class="form-group">

<label for="lga">LGA *</label>

<select id="lga" required>

<option value="" selected disabled>-- Select LGA --</option>

<option value="Hadejia">Hadejia</option>

</select>

</div>

<div class="form-group">

<label for="ward">Ward *</label>

<select id="ward" required>

<option value="" selected disabled>-- Select Ward --</option>

<option value="Sabon Garu">Sabon Garu</option>

</select>

</div>

<button type="submit" class="submit-btn">

Submit Application

</button>

</form>

<div class="admin-link">

<a href="#" onclick="adminWarning()">

🔒 Admin Login

</a>

</div>

<div class="footer">

<p>Powered by</p>

<h3>Hamdala Technologies</h3>

<p>09066884265</p>

</div>

</main>

<script type="module" src="script.js"></script>

</body>
    </html>
