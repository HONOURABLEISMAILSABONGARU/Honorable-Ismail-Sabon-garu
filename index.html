<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HONOURABLE ISMAIL SABON GARU</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
  <div style="background:#006400;color:white;text-align:center;padding:20px;">
    <h2>WELCOME</h2>
    <img src="logo.png" alt="Logo" width="120">

    <h1>HONOURABLE ISMAIL SABON GARU</h1>
    <p>Official Registration Portal</p>
  </div>

  <div style="max-width:500px;margin:30px auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.2);">

    <h2 style="text-align:center;">Dashboard</h2>

    <form>

      <label>Passport Photo (PNG/JPG, White Background, Max 2MB)</label><br>
      <input type="file" accept=".png,.jpg,.jpeg"><br><br>

      <input type="text" id="firstName" name="firstName" placeholder="Enter First Name" style="width:100%;padding:10px;" required><br><br>
      <input type="text" id="middleName" name="middleName" placeholder="Enter Middle Name" style="width:100%;padding:10px;" required><br><br>

      <input type="text" id="lastName" name="lastName" placeholder="Enter Last Name" style="width:100%;padding:10px;" required><br><br>

      <input type="text" id="address" name="address" placeholder="Enter Your Address" style="width:100%;padding:10px;" required><br><br>

      <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter Phone Number" maxlength="11" style="width:100%;padding:10px;" required><br><br>

      <label>State</label><br>
<select id="state" name="state" style="width:100%;padding:10px;" required>
  <option value="">-- Select State --</option>
  <option value="Jigawa">Jigawa</option>
</select><br><br>

<label>LGA</label><br>
<select id="lga" name="lga" style="width:100%;padding:10px;" required>
  <option value="">-- Select LGA --</option>
  <option value="Hadejia">Hadejia</option>
</select><br><br>

    <label>Ward</label><br>
<select id="ward" name="ward" style="width:100%;padding:10px;" required>
  <option value="">-- Select Ward --</option>
  <option value="Sabon Garu">Sabon Garu</option>
</select><br><br>

<button type="submit" id="submitBtn" style="width:100%;padding:15px;background:#006400;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:bold;cursor:pointer;">
  Submit Application
</button>
    <form id="registrationForm">

  </div>
<script src="script.js"></script>
</body>
  </html>
