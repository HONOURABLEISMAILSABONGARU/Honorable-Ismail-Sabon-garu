<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honourable Ismail Sabon Garu - Registration Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f8f5;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #006400, #0b8f4d);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .header img {
      width: 85px;
      height: 85px;
      object-fit: contain;
      background: white;
      border-radius: 50%;
      padding: 5px;
      margin-bottom: 10px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 25px;
    }

    .header p {
      margin: 5px 0;
      font-size: 16px;
    }

    .container {
      width: 94%;
      max-width: 650px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,.10);
    }

    .title {
      text-align: center;
      color: #006400;
      margin: 0 0 20px;
      font-size: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: #006400;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #006400;
      box-shadow: 0 0 0 2px rgba(0,100,0,.08);
    }

    .passport-box {
      text-align: center;
      border: 2px dashed #006400;
      border-radius: 12px;
      padding: 18px;
    }

    #passportPreview {
      display: none;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      margin: 10px auto;
      border: 2px solid #006400;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #006400;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .submit-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .admin-btn {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: 2px solid #006400;
      border-radius: 10px;
      background: white;
      color: #006400;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      padding: 25px 10px;
      color: #555;
    }

    .footer strong {
      color: #006400;
      font-size: 18px;
    }

    @media(max-width:480px) {
      .header h1 {
        font-size: 21px;
      }

      .card {
        padding: 17px;
      }

      .title {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <img src="logo.png" alt="Logo">

    <h1>WELCOME</h1>

    <h1>HONOURABLE ISMAIL SABON GARU</h1>

    <p>Official Registration Portal</p>

  </header>


  <main class="container">

    <section class="card">

      <h2 class="title">
        MEMBERSHIP REGISTRATION FORM
      </h2>


      <form id="registrationForm">


        <div class="field">
          <label for="firstName">
            First Name *
          </label>

          <input
            id="firstName"
            name="firstName"
            type="text"
            required
          >
        </div>


        <div class="field">
          <label for="middleName">
            Middle Name
          </label>

          <input
            id="middleName"
            name="middleName"
            type="text"
          >
        </div>


        <div class="field">
          <label for="lastName">
            Last Name *
          </label>

          <input
            id="lastName"
            name="lastName"
            type="text"
            required
          >
        </div>


        <div class="field">
          <label for="address">
            Address *
          </label>

          <input
            id="address"
            name="address"
            type="text"
            required
          >
        </div>


        <div class="field">
          <label for="phoneNumber">
            Phone Number *
          </label>

          <input
            id="phoneNumber"
            name="phoneNumber"
            type="tel"
            required
          >
        </div>


        <div class="field">
          <label for="gender">
            Gender *
          </label>

          <select
            id="gender"
            name="gender"
            required
          >
            <option value="">
              Select Gender
            </option>

            <option value="Male">
              Male
            </option>

            <option value="Female">
              Female
            </option>
          </select>
        </div>


        <div class="field">
          <label for="state">
            State *
          </label>

          <select
            id="state"
            name="state"
            required
          >
            <option value="">
              Select State
            </option>

            <option value="Jigawa">
              Jigawa
            </option>
          </select>
        </div>


        <div class="field">
          <label for="lga">
            LGA *
          </label>

          <select
            id="lga"
            name="lga"
            required
          >
            <option value="">
              Select LGA
            </option>

            <option value="Hadejia">
              Hadejia
            </option>
          </select>
        </div>


        <div class="field">
          <label for="ward">
            Ward *
          </label>

          <select
            id="ward"
            name="ward"
            required
          >
            <option value="">
              Select Ward
            </option>

            <option value="Sabon Garu">
              Sabon Garu
            </option>
          </select>
        </div>


        <div class="field">

          <label>
            Passport Photo *
          </label>

          <div class="passport-box">

            <input
              id="passport"
              name="passport"
              type="file"
              accept=".jpg,.jpeg,.png,image/jpeg,image/png"
              required
            >

            <img
              id="passportPreview"
              alt="Passport Preview"
            >

            <div
              style="
                font-size:13px;
                color:#666;
                margin-top:8px;
              "
            >
              JPG or PNG only.
              Maximum size: 2MB.
            </div>

          </div>

        </div>


        <button
          id="submitButton"
          class="submit-btn"
          type="submit"
        >
          Submit Application
        </button>

      </form>


      <button
        id="adminLogin"
        class="admin-btn"
        type="button"
        onclick="window.location.href='admin.html'"
      >
        Admin Login
      </button>

    </section>

  </main>


  <footer class="footer">

    <div>
      Powered by
    </div>

    <strong>
      Hamdala Technologies
    </strong>

    <div style="margin-top:5px;">
      09066884265
    </div>

  </footer>


  <script>

    const passportInput =
      document.getElementById("passport");

    const passportPreview =
      document.getElementById("passportPreview");


    if (passportInput && passportPreview) {

      passportInput.addEventListener(
        "change",
        function () {

          const file =
            this.files && this.files[0];


          if (!file) {

            passportPreview.style.display =
              "none";

            passportPreview.removeAttribute(
              "src"
            );

            return;
          }


          if (
            file.size >
            2 * 1024 * 1024
          ) {

            alert(
              "Passport photo must not be larger than 2MB."
            );

            this.value = "";

            passportPreview.style.display =
              "none";

            passportPreview.removeAttribute(
              "src"
            );

            return;
          }


          const reader =
            new FileReader();


          reader.onload =
            function (e) {

              passportPreview.src =
                e.target.result;

              passportPreview.style.display =
                "block";

            };


          reader.readAsDataURL(file);

        }
      );

    }

  </script>


  <!-- IMPORTANT:
       This is your existing registration script.
       Do not rename this file. -->

  <script
    type="module"
    src="script.js"
  ></script>


</body>
    </html>
