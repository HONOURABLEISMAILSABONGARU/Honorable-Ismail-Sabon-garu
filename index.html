<!DOCTYPE html>

<head>

<body>

<header class="header">

    <img src="logo.png" alt="TTT Logo" class="logo">

    <h2>WELCOME</h2>

    <h1>HONOURABLE ISMAIL SABON GARU</h1>

    <p class="subtitle">MEMBERSHIP REGISTRATION FORM</p>

<main class="container">

<form id="registrationForm">

<div class="form-group">
<label for="passport">Passport Photo</label>
<input type="file" id="passport" accept=".jpg,.jpeg,.png" required>
</div>

<div class="form-group">
<label for="firstName">First Name</label>

</div>

<label for="middleName">Middle Name</label>
<input type="text" id="middleName" placeholder="Enter Middle Name">
</div>

<div class="form-group">
<label for="lastName">Last Name</label>
<input type="text" id="lastName" placeholder="Enter Last Name" required>
  </div>
