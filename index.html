<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HONOURABLE ISMAIL SABON GARU</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">

<img src="logo.png" alt="TTT Logo" class="logo">

<h2>WELCOME</h2>

<h1>HONOURABLE ISMAIL SABON GARU</h1>

<h3>MEMBERSHIP REGISTRATION FORM</h3>

</div>

<div class="container">
<label>Passport Photo (PNG/JPG, White Background, Max 2MB)</label>
<input type="file" id="passport" accept=".png,.jpg,.jpeg" required>

<input type="text" id="firstName" placeholder="Enter First Name" required>

<input type="text" id="middleName" placeholder="Enter Middle Name" required>

<input type="text" id="lastName" placeholder="Enter Last Name" required>

<input type="text" id="address" placeholder="Enter Your Address" required>

<input type="tel" id="phoneNumber" placeholder="Enter Phone Number" maxlength="11" required>

<label>Gender</label>
<select id="gender" required>
  <option value="">-- Select Gender --</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select>

<label>State</label>
<select id="state" required>
  <option value="">-- Select State --</option>
  <option value="Jigawa">Jigawa</option>
</select>

<label>LGA</label>
<select id="lga" required>
  <option value="">-- Select LGA --</option>
  <option value="Hadejia">Hadejia</option>
</select>

<label>Ward</label>
<select id="ward" required>
  <option value="">-- Select Ward --</option>
  <option value="Sabon Garu">Sabon Garu</option>
</select>

<button type="submit">Submit Application</button>
    </form>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
