<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#006400,#0b8f4d);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.login-box{
background:#fff;
width:100%;
max-width:400px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
text-align:center;
}

.warning{
background:#fff3cd;
color:#856404;
padding:12px;
border-radius:10px;
margin-bottom:20px;
font-size:14px;
font-weight:bold;
}

h2{
color:#006400;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:2px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#006400;
color:#fff;
border:none;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#0b8f4d;
}

.back{
margin-top:20px;
}

.back a{
color:#006400;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

<div class="warning">
⚠️ Restricted Access.<br>
This page is for Administrator only.
</div>

<h2>🔒 Admin Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<div class="back">
<a href="index.html">← Back to Registration</a>
</div>

</div>

<script>
function login(){

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

if(username==="Admin" && password==="Sabongaru@12"){

alert("Login Successful");

// Daga baya za mu maye gurbin wannan
window.location.href="dashboard.html";

}else{

alert("Invalid Username or Password");

}

}
</script>

</body>
</html>
