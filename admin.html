<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrator Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7f6;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:#fff;
width:100%;
max-width:430px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
text-align:center;
}

.icon{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:#006400;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
color:white;
}

h2{
margin-top:20px;
color:#0f172a;
}

.message{
margin-top:15px;
color:#555;
line-height:1.7;
}

input{
width:100%;
padding:15px;
margin-top:15px;
border:2px solid #ddd;
border-radius:10px;
font-size:16px;
outline:none;
}

input:focus{
border-color:#006400;
}

button{
width:100%;
padding:15px;
margin-top:18px;
background:#006400;
color:white;
border:none;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.back{
display:block;
margin-top:15px;
text-decoration:none;
color:#006400;
font-weight:bold;
}
</style>

</head>

<body>

<div class="card">

<div class="icon">
🔒
</div>

<h2>Restricted Access</h2>

<p class="message">
This area is reserved for the System Administrator only.
<br><br>
Only authorized administrators are allowed to continue.
</p>

<input
type="text"
id="username"
placeholder="Administrator Username">

<input
type="password"
id="password"
placeholder="Administrator Password">

<button onclick="login()">
Login
</button>

<a class="back" href="index.html">
← Back to Registration
</a>

</div>

<script>

function login(){

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

if(username==="Admin" && password==="Sabongaru@12"){

window.location.href="dashboard.html";

}else{

alert("Invalid Username or Password.");

}

}

</script>

</body>
</html>
